<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="login">
      <header>
        <div class="logo-header">
          <img src="assets/image/logo_clean-removebg-preview.png" alt="Logo Tech Music" />
        </div>
        <nav>
          <li>
            <a href="./index.html">HOME</a>
            <a href="./index.html#sobre">SOBRE NÓS</a>
            <a href="login.html">LOGIN</a>
          </li>
        </nav>
      </header>

      <div class="container">
        <div class="conteudo-login">
          <h1>CADASTRE-SE</h1>
          <div class="conteudo-log">
            <div>
              <p>Insira seu nome:</p>
              <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input id="ipt_nome" type="text" placeholder="Nome" />
              </div>
            </div>

            <div>
              <p>Insira um Email:</p>
              <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input id="ipt_email" type="text" placeholder="Email" />
              </div>
            </div>

            <div>
              <p>Insira uma senha:</p>
              <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input id="ipt_senha" type="password" placeholder="Senha" />
              </div>
            </div>
            <div>
              <p>Confirme sua senha:</p>
              <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input
                  id="ipt_confirmar_senha"
                  type="password"
                  placeholder="Confirmar senha"
                />
              </div>
            </div>

            <button onclick="cadastrarUsuario()">CADASTRAR</button>
          </div>

          <div class="footer">
            <a class="link" href="login.html"
              >Ja possui uma conta? Realizar login</a
            >
            <a class="link" href="./index.html">Voltar à home</a>
          </div>
        </div>
      </div>
    </div>

    <div class="imagem">
      <img src="assets/image/LOGIN.png" alt="" />
    </div>
    <div class="logo">
      <img src="assets/image/Logo 1.png" alt="" />
    </div>
  </body>
</html>

<script>
  function cadastrarUsuario() {
    var nome = ipt_nome.value;
    var email = ipt_email.value;
    var senha = ipt_senha.value;
    var confirmarSenha = ipt_confirmar_senha.value;

    if (validarCadastro()) {
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nome,
          emailServer: email,
          senhaServer: senha,
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            alert(
              "Cadastro realizado com sucesso! Redirecionando para tela de Login...",
            );

            setTimeout(() => {
              window.location = "login.html";
            }, "2000");
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });
    }
  }

  function validarCadastro() {
    var nome = ipt_nome.value.trim();
    var email = ipt_email.value.trim();
    var senha = ipt_senha.value;
    var confirmarSenha = ipt_confirmar_senha.value;

    if (!validarNome(nome)) return false;
    if (!validarEmail(email)) return false;
    if (!validarSenha(senha)) return false;
    if (!validarConfirmacaoSenha(senha, confirmarSenha)) return false;

    return true;
  }

  function validarNome(nome) {
    if (nome === "") {
      alert("O campo Nome não pode ficar em branco.");
      return false;
    }

    if (nome.length < 3) {
      alert("Nome deve possuir no mínimo 3 caracteres.");
      return false;
    }

    return true;
  }

  function validarEmail(email) {
    if (email === "") {
      alert("O campo Email não pode ficar em branco.");
      return false;
    }

    if (!email.includes("@")) {
      alert("O email precisa conter '@'.");
      return false;
    }

    var dominiosValidos = [
      "gmail.com",
      "hotmail.com",
      "outlook.com",
      "yahoo.com",
    ];

    var partesEmail = email.split("@");

    if (partesEmail.length !== 2) {
      alert("Email inválido.");
      return false;
    }

    var dominio = partesEmail[1].toLowerCase();

    var dominioValido = dominiosValidos.includes(dominio);

    if (!dominioValido) {
      alert("Domínio de email não permitido.");
      return false;
    }

    return true;
  }

  function validarSenha(senha) {
    if (senha === "") {
      alert("O campo Senha não pode ficar em branco.");
      return false;
    }

    if (senha.length < 6) {
      alert("A senha deve ter no mínimo 6 caracteres.");
      return false;
    }

    var temMaiuscula = false;
    var temMinuscula = false;
    var temNumero = false;
    var temEspecial = false;

    var caracteresEspeciais = "!@#$%^&*()-_=+[]{};:,.<>?";

    for (var i = 0; i < senha.length; i++) {
      var caractere = senha[i];

      if (caractere >= "A" && caractere <= "Z") {
        temMaiuscula = true;
      } else if (caractere >= "a" && caractere <= "z") {
        temMinuscula = true;
      } else if (caractere >= "0" && caractere <= "9") {
        temNumero = true;
      } else if (caracteresEspeciais.includes(caractere)) {
        temEspecial = true;
      }
    }

    if (!temMaiuscula) {
      alert("A senha deve conter pelo menos 1 letra maiúscula.");
      return false;
    }

    if (!temMinuscula) {
      alert("A senha deve conter pelo menos 1 letra minúscula.");
      return false;
    }

    if (!temNumero) {
      alert("A senha deve conter pelo menos 1 número.");
      return false;
    }

    if (!temEspecial) {
      alert("A senha deve conter pelo menos 1 caractere especial.");
      return false;
    }

    return true;
  }

  function validarConfirmacaoSenha(senha, confirmarSenha) {
    if (confirmarSenha === "") {
      alert("Confirme sua senha.");
      return false;
    }

    if (senha !== confirmarSenha) {
      alert("As senhas não coincidem.");
      return false;
    }

    return true;
  }
</script>
